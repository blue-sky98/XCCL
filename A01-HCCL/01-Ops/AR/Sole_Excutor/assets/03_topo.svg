crosoft YaHei',sans-serif" font-weight="700" fill="#3A7BD5">AG · Step1（Δ=1，环通信）</text><text x="1520" y="112" text-anchor="middle" font-size="10" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" fill="#8a97a3">每对双向交换 2 slice 纯拷贝，各 ds/2</text><line x1="1466" y1="152" x2="1574" y2="152" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1574" y1="138" x2="1466" y2="138" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1593" y1="171" x2="1593" y2="279" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1607" y1="279" x2="1607" y2="171" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1574" y1="298" x2="1466" y2="298" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1466" y1="312" x2="1574" y2="312" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1447" y1="279" x2="1447" y2="171" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><line x1="1433" y1="171" x2="1433" y2="279" stroke="#3A7BD5" stroke-width="2.2" marker-end="url(#arrAG)"></line><text x="1520" y="163" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" font-weight="700" fill="#3A7BD5">2·ds/4=ds/2</text><circle cx="1440" cy="145" r="24" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"></circle><text x="1440" y="150" text-anchor="middle" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" fill="#333">r0</text><circle cx="1600" cy="145" r="24" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"></circle><text x="1600" y="150" text-anchor="middle" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" fill="#333">r1</text><circle cx="1600" cy="305" r="24" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"></circle><text x="1600" y="310" text-anchor="middle" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-